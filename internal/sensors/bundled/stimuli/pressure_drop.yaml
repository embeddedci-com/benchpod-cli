format: 1
kind: stimulus
name: pressure_drop
label: "Pressure drop and a loop break"
description: |
  A line at 6 bar with a little noise, a leak that drops it to 1.5 bar in 3 s, a slow recovery,
  and a broken loop (the `open` fault: 0 mA) from 80 s to 85 s. Drives `pressure_bar` of the
  `pressure_4_20ma` transmitter.
rate_hz: 20
signals:
  pressure_bar:
    - { shape: noise, mean: 6, sigma: 0.02, seed: 1, duration_s: 30 }
    - { shape: ramp, start: 6, end: 1.5, duration_s: 3 }
    - { shape: hold, value: 1.5, duration_s: 17 }
    - { shape: ramp, end: 6, duration_s: 20 }
    - { shape: hold, value: 6, duration_s: 20 }
faults:
  - { at_s: 80, duration_s: 5, type: open }
