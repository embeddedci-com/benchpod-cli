format: 1
kind: analog
name: pressure_4_20ma
label: "Pressure transmitter, 0 to 10 bar, 4-20 mA"
description: |
  A two-wire 4-20 mA pressure transmitter: 4 mA at 0 bar, 20 mA at 10 bar. Outside the span the
  current saturates at 3.8 and 20.5 mA, as NAMUR NE 43 asks, so a DUT can tell a pressure out of
  range from a broken loop. The `open` fault drops the loop to 0 mA (a wire break), `short`
  drives 22 mA. Copy the file and change the span constants for another transmitter.
datasheet: https://en.wikipedia.org/wiki/Current_loop
version: 1.0.0
license: Apache-2.0

params:
  - { key: pressure_bar, unit: bar, min: -1, max: 12, default: 1, label: Pressure }

constants:
  P_LOW: 0                   # pressure at 4 mA (bar)
  P_HIGH: 10                 # pressure at 20 mA (bar)
  I_SAT_LOW: 3.8             # NE 43 saturation limits (mA)
  I_SAT_HIGH: 20.5

output: current
value: "clamp(4 + 16 * (pressure_bar - P_LOW) / (P_HIGH - P_LOW), I_SAT_LOW, I_SAT_HIGH)"
range: { min: 0, max: 22 }
