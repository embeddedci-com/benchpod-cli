format: 1
kind: i2c
name: bmp280
label: "Bosch BMP280: temperature and pressure"
description: |
  Forced and normal mode with a fixed factory trim. Readings come from the datasheet's own
  compensation formulas: the pod solves them for the raw codes.
datasheet: https://www.bosch-sensortec.com/products/environmental-sensors/pressure-sensors/pressure-sensors-bmp280/
version: 1.0.0
license: Apache-2.0

params:
  - { key: temperature_c, unit: C, min: -100, max: 150, default: 25, label: Temperature }
  - { key: pressure_pa, unit: Pa, min: 1000, max: 200000, default: 101325, label: Pressure }

i2c:
  address: 0x76
  alt_addresses: [0x77]

constants:
  T1: 27504
  T2: 26435
  T3: -1000
  P1: 36477
  P2: -10685
  P3: 3024
  P4: 2855
  P5: 140
  P6: -7
  P7: 15500
  P8: -14600
  P9: 6000

functions:
  t_fine:                    # datasheet 4.2.3, bmp280_compensate_T_int32
    args: [adc_t]
    let:
      - var1: "(((adc_t >> 3) - (T1 << 1)) * T2) >> 11"
      - var2: "(((((adc_t >> 4) - T1) * ((adc_t >> 4) - T1)) >> 12) * T3) >> 14"
    return: "var1 + var2"
  temp_c:
    args: [adc_t]
    return: "((t_fine(adc_t) * 5 + 128) >> 8) / 100"
  press_pa:                  # double-precision compensation, as the Bosch reference driver
    args: [adc_p, tf]
    let:
      - v1: "tf - 128000"
      - v2a: "v1 * v1 * P6 + v1 * P5 * 131072 + P4 * 34359738368"
      - v1b: "((140737488355328 + v1 * v1 * P3 / 256 + v1 * P2 * 4096) * P1) / 8589934592"
      - p0: "((1048576 - adc_p) * 2147483648 - v2a) * 3125 / v1b"
      - r13: "trunc(p0 / 8192)"
      - w1: "trunc(P9 * r13 * r13 / 33554432)"
      - w2: "trunc(P8 * p0 / 524288)"
    return: "(trunc((p0 + w1 + w2) / 256) + P7 * 16) / 256"

let:
  - adc_t: "solve(temp_c, temperature_c, 0, 0xFFFFF)"
  - tf: "t_fine(adc_t)"
  - adc_p: "solve(press_pa(_, tf), pressure_pa, 0, 0xFFFFF)"

registers:
  - { at: 0x88, u16le: T1, name: dig_T1 }
  - { at: 0x8A, s16le: T2 }
  - { at: 0x8C, s16le: T3 }
  - { at: 0x8E, u16le: P1 }
  - { at: 0x90, s16le: P2 }
  - { at: 0x92, s16le: P3 }
  - { at: 0x94, s16le: P4 }
  - { at: 0x96, s16le: P5 }
  - { at: 0x98, s16le: P6 }
  - { at: 0x9A, s16le: P7 }
  - { at: 0x9C, s16le: P8 }
  - { at: 0x9E, s16le: P9 }
  - { at: 0xD0, u8: 0x58, name: id, writable: false }
  - { at: 0xF3, u8: 0x00, name: status }
  - { at: 0xF4, u8: 0x00, name: ctrl_meas }
  - { at: 0xF5, u8: 0x00, name: config }
  - at: 0xF7
    name: press_temp
    bytes:
      - "bits(adc_p, 19, 12)"
      - "bits(adc_p, 11, 4)"
      - "bits(adc_p, 3, 0) << 4"
      - "bits(adc_t, 19, 12)"
      - "bits(adc_t, 11, 4)"
      - "bits(adc_t, 3, 0) << 4"

conversion:
  trigger: 0xF4
  time_us: 5500
  busy: { at: 0xF3, mask: 0x08 }

on_write:
  - when: "written == 0xE0 && value == 0xB6"
    do: reset
