format: 1
kind: uart
name: mhz19b
label: "Winsen MH-Z19B: CO2 over UART"
description: |
  Answers the read command (0xFF 0x01 0x86 ... 0x79) with the CO2 concentration and the
  checksum from the datasheet (0xFF minus the sum of bytes 1 to 7, plus 1). Byte 4 carries the
  temperature + 40, as the part does (undocumented; several drivers read it). Calibration and
  range commands are not answered, as on the part.
datasheet: https://www.winsen-sensor.com/sensors/co2-sensor/mh-z19b.html
version: 1.0.0
license: Apache-2.0

params:
  - { key: co2_ppm, unit: ppm, min: 0, max: 10000, default: 600, label: CO2 }
  - { key: temperature_c, unit: C, min: -40, max: 85, default: 25, label: Temperature }

uart: { baud: 9600, format: 8N1 }

functions:
  checksum:                  # datasheet getCheckSum over bytes 1..7
    args: [b1, b2, b3, b4, b5, b6, b7]
    return: "u8(0x100 - sum8(b1, b2, b3, b4, b5, b6, b7))"

let:
  - co2: "sat_u16(co2_ppm)"
  - temp: "sat_u8(temperature_c + 40)"

requests:
  - match: [0xFF, "*", 0x86, "*", "*", "*", "*", "*", "*"]    # read CO2 concentration
    answer: [0xFF, 0x86, "byte(co2, 1)", "byte(co2, 0)", "temp", 0, 0, 0,
             "checksum(0x86, byte(co2, 1), byte(co2, 0), temp, 0, 0, 0)"]
    delay_ms: 10
