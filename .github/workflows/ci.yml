name: ci

# Runs on every push/PR: vet + tests, plus a full GoReleaser snapshot build so
# a cross-platform break (e.g. the macOS cgo/IOKit requirement) is caught before
# tagging a release rather than during it.
on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this workflow so a tag publishes only after the same checks pass.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # Pinned to ubuntu-24.04: ubuntu-latest moves to Ubuntu 26 from 2026-10-19. Unpin once 26.04 is verified.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The firmware's refusal texts are pinned in internal/fwrefusals; the test checks them
      # against the firmware's main branch, so a wording change there fails here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: embeddedci-com/benchpod-firmware
          ref: main
          path: benchpod-firmware
          sparse-checkout: stm32h563/src
          persist-credentials: false
      # The device table of the pin programmers is generated from embeddedci-python's prog-devices/
      # (one YAML file per chip); the copy in internal/progdev must be that generator's output.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: embeddedci-com/embeddedci-python
          ref: main
          path: embeddedci-python
          sparse-checkout: |
            prog-devices
            scripts
            packages/embeddedci/src/embeddedci/benchpod
          persist-credentials: false
      - name: Pin-programmer device table matches the YAML source
        run: |
          python3 -m pip install pyyaml
          scripts/sync-prog-devices.sh --check embeddedci-python
      - run: go vet ./...
      - run: go test ./... -count=1
        env:
          BENCHPOD_FIRMWARE_DIR: ${{ github.workspace }}/benchpod-firmware

  build:
    # Linux, so a PR never waits on a macOS runner (they were often not assigned within GitHub's
    # 15 minutes, which cancelled the job). The darwin binaries need cgo + IOKit, so they are only
    # built by the release job on macOS; here the whole GoReleaser config is checked and the
    # pure-Go Linux and Windows binaries are snapshot-built.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: check
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: build --snapshot --clean --id linux-windows
