name: release

# Publish Windows / Linux / macOS binaries to a GitHub Release whenever a
# version tag is pushed, e.g.:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
on:
  push:
    tags:
      - "v*"

# Nothing is published until two gates pass:
#   verify  the tag is a plain vX.Y.Z on a commit in main, and the source does
#           not hardcode a version (main.version must stay "dev"; GoReleaser
#           sets it from the tag, so the tag is the only version source)
#   tests   the full ci.yml (vet, tests, GoReleaser snapshot build)
permissions:
  contents: read

jobs:
  verify:
    # Pinned to ubuntu-24.04: ubuntu-latest moves to Ubuntu 26 from 2026-10-19. Unpin once 26.04 is verified.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tag
        run: |
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $tag is not vX.Y.Z" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $tag points at $GITHUB_SHA, which is not on main" >&2
            exit 1
          fi
          if ! grep -qx 'var version = "dev"' cmd/benchpod-cli/root.go; then
            echo "::error::cmd/benchpod-cli/root.go must keep var version = \"dev\" (the tag sets it)" >&2
            exit 1
          fi

  tests:
    uses: ./.github/workflows/ci.yml

  goreleaser:
    needs: [verify, tests]
    # The GitHub Release is created in this repo, so the default GITHUB_TOKEN
    # needs write access to contents. The Homebrew cask is pushed to a different
    # repo (homebrew-tap) and uses a separate PAT, see TAP_GITHUB_TOKEN below.
    permissions:
      contents: write
      # cosign keyless signing of checksums.txt (Sigstore Fulcio certificate for this workflow).
      id-token: write
    # TAP_GITHUB_TOKEN is a secret of the `release` environment (v* tags only), not of the repo.
    environment: release
    # macOS runner: macOS binaries need cgo (IOKit); Linux/Windows cross-compile
    # from here with cgo off. See .goreleaser.yaml for the full rationale.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs full history + tags for the changelog

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.3

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          # Apple signing + notarization (.goreleaser.yaml `notarize`): skipped while these
          # secrets are unset. MACOS_SIGN_P12 = base64 of the Developer ID Application .p12,
          # MACOS_NOTARY_KEY = base64 of the App Store Connect API key (.p8).
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          # Creates the release in THIS repo (default token is enough).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the Homebrew cask to embeddedci-com/homebrew-tap (a different
          # repo): a PAT with write access to that tap repo.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
